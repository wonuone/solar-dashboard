<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Monitoring Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .dashboard-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .chart-container {
            width: 400px;
            height: 300px;
        }
    </style>
</head>
<body>
    <h1>Solar Monitoring Dashboard</h1>
    <div class="dashboard-container">
        <div class="chart-container" id="solar_efficiency"></div>
        <div class="chart-container" id="solar_power"></div>
        <div class="chart-container" id="energy_consumption"></div>
        <div class="chart-container" id="battery_level"></div>
        <div class="chart-container" id="temperature"></div>
    </div>

    <script>
        let charts = JSON.parse('{{ charts|safe }}');

        for (let key in charts) {
            Plotly.newPlot(key, JSON.parse(charts[key]));
        }
    </script>
</body>
</html>
