<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Chart.js library for rendering charts -->
    <style>
        /* Basic styling for the page */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }
        canvas {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Pie Chart</h2>
        <canvas id="pieChart"></canvas> <!-- Canvas element where the pie chart will be rendered -->

        <h2>Bar Graph</h2>
        <canvas id="barChart"></canvas> <!-- Canvas element where the bar graph will be rendered -->
    </div>

    <script>
        // Get data dynamically from Flask, this will be replaced with actual JSON data from Flask backend
        let pieData = JSON.parse('{{ pie_data | tojson | safe }}'); 
        let barData = JSON.parse('{{ bar_data | tojson | safe }}');

        // Create a Pie Chart using Chart.js
        new Chart(document.getElementById('pieChart'), {
            type: 'pie', // Defines the type of chart
            data: {
                labels: pieData.labels, // Labels for pie chart categories
                datasets: [{
                    data: pieData.values, // Values corresponding to each category
                    backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56'] // Colors for each section
                }]
            }
        });

        // Create a Bar Chart using Chart.js
        new Chart(document.getElementById('barChart'), {
            type: 'bar', // Defines the type of chart
            data: {
                labels: barData.labels, // Labels for each bar (e.g., months)
                datasets: [{
                    label: 'Monthly Data', // Label for the dataset
                    data: barData.values, // Data values for each bar
                    backgroundColor: ['#36A2EB'] // Color of the bars
                }]
            }
        });
    </script>
</body>
</html>
